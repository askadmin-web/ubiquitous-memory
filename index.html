<!DOCTYPE html>
<html lang="en">
<head>
 <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QVZ0K1D563"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-QVZ0K1D563');

  // Capture ?ref= parameter
  const refParam = new URLSearchParams(window.location.search).get('ref');
  if (refParam) {
    gtag('event', 'page_view', {
      'ref': refParam
    });
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cathy Rudolph — Portfolio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="nav.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f7f6f3;
    --text-primary: #1a1a18;
    --text-secondary: #4a4a46;
    --text-tertiary: #888780;
    --border: rgba(0,0,0,0.12);
    --border-hover: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  body.dark {
    --bg: #1e1e1c;
    --bg-secondary: #2a2a27;
    --text-primary: #f0ede6;
    --text-secondary: #b0ada5;
    --text-tertiary: #6e6c67;
    --border: rgba(255,255,255,0.1);
    --border-hover: rgba(255,255,255,0.2);
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100vh;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  .page-name {
    font-size: 30px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .page-tagline {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    max-width: 55ch;
    margin-bottom: 0.4rem;
  }

  .page-location {
    font-size: 13px;
    color: var(--text-tertiary);
    margin-bottom: 2.5rem;
  }

  hr { border: none; border-top: 0.5px solid var(--border); margin: 18px 0; }

  /* ── Group heading ── */
  .group { margin-bottom: 2.5rem; }
  .group:last-child { margin-bottom: 0; }

  .group-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .section-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }

  .group-count {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--text-tertiary);
    opacity: 0.7;
  }

  .group-blurb {
    font-size: 12.5px;
    color: var(--text-tertiary);
    line-height: 1.6;
    max-width: 62ch;
    margin-bottom: 14px;
  }

  /* ── Cards ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }

  .cards-stack {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .card {
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    text-decoration: none;
    color: inherit;
    background: var(--bg);
    transition: background 0.15s, border-color 0.15s;
    display: block;
  }

  .card:hover { background: var(--bg-secondary); border-color: var(--border-hover); }

  .card-icon { font-size: 20px; color: var(--text-tertiary); margin-bottom: 10px; }
  .card-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 5px; }
  .card-desc { font-size: 12px; color: var(--text-tertiary); line-height: 1.6; }

  .card-badge {
    display: inline-block;
    margin-top: 10px;
    font-size: 10.5px;
    font-weight: 500;
    padding: 2px 9px;
    border-radius: 20px;
    background: var(--bg-secondary);
    color: var(--text-tertiary);
    border: 0.5px solid var(--border);
  }

  .card-badge.live { background: #E1F5EE; color: #085041; border-color: transparent; }
  body.dark .card-badge.live { background: #085041; color: #9fe1cb; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (max-width: 560px) {
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<script>
(function () {
  var saved = localStorage.getItem('theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.body.classList.toggle('dark', saved ? saved === 'dark' : prefersDark);
})();
</script>

<div id="nav-placeholder"></div>
<script src="pages.js"></script>
<script src="nav-inject.js"></script>

<main class="page">
  <h1 class="sr-only">Cathy Rudolph — Portfolio</h1>
  <div class="page-name" id="owner-name"></div>
  <p class="page-tagline" id="owner-tagline"></p>
  <p class="page-location" id="owner-location"></p>

  <hr>

  <!-- Everything below is generated from pages.js. Do not hand-edit. -->
  <div id="portfolio-groups"></div>
</main>

<script>
(function () {
  var P = window.PORTFOLIO;
  if (!P) {
    document.getElementById('portfolio-groups').textContent =
      'Portfolio manifest failed to load.';
    return;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  document.getElementById('owner-name').textContent = P.owner.name;
  document.getElementById('owner-tagline').textContent = P.owner.tagline;
  document.getElementById('owner-location').textContent = P.owner.location;

  var host = document.getElementById('portfolio-groups');

  host.innerHTML = P.liveGroups().map(function (g) {
    var cards = g.pages.map(function (p) {
      return '' +
        '<a href="' + esc(p.file) + '" class="card">' +
          '<div class="card-icon"><i class="ti ti-' + esc(p.icon) + '" aria-hidden="true"></i></div>' +
          '<div class="card-title">' + esc(p.title) + '</div>' +
          '<div class="card-desc">' + esc(p.desc) + '</div>' +
          '<span class="card-badge live">Live</span>' +
        '</a>';
    }).join('');

    return '' +
      '<section class="group">' +
        '<div class="group-head">' +
          '<div class="section-label">' + esc(g.label) + '</div>' +
          '<div class="group-count">' + g.pages.length + '</div>' +
        '</div>' +
        (g.blurb ? '<p class="group-blurb">' + esc(g.blurb) + '</p>' : '') +
        '<div class="' + (g.layout === 'grid' ? 'cards-grid' : 'cards-stack') + '">' +
          cards +
        '</div>' +
      '</section>';
  }).join('');

  // Forward ?ref= to the portfolio cards so outreach attribution survives
  // navigation into a portfolio page. Nav links are handled by
  // nav-inject.js's forwardRef(), which runs when the nav is built.
  var ref = new URLSearchParams(window.location.search).get('ref');
  if (ref) {
    document.querySelectorAll('a.card').forEach(function (a) {
      var href = a.getAttribute('href');
      if (!href || /^(https?:|mailto:|#)/.test(href)) return;
      a.setAttribute('href', href + (href.indexOf('?') > -1 ? '&' : '?') + 'ref=' + encodeURIComponent(ref));
    });
  }
})();
</script>

</body>
</html>
