<script>
/* ==========================================================================
   CONFIG: edit this block to change the topic.
   - options: the choices. "id" is a short code used in ballots, "short" is
     the label on the bar chart, "color" is any CSS color.
   - sampleVoters: how many sample voters are already "in the ballot box".
     Their ballots are generated fresh on every visit, filtered so the count
     always takes at least three rounds. About two times in three, the
     first-round leader ends up losing.
   - fixedBallots: optional. Leave it [] for random sample voters, or list
     ballots like { count: 3, ranking: ["SM","GA","CR","TP","JE"] } to use
     the same sample every time.
   For pie flavors or Halloween candy, just swap the names and nouns.
   ========================================================================== */
const CONFIG = {
  title: "Ranked Choice, by the Cup",
  subtitle: "Five North Coast Coffee origins, one winner. Rank your favorites and watch how ranked choice voting picks it.",
  noun: "coffee",
  nounPlural: "coffees",
  options: [
    { id: "TP", name: "Tanzanian Peaberry",      short: "Tanzanian",   color: "#c0843d" },
    { id: "GA", name: "Guatemalan Antigua",      short: "Guatemalan",  color: "#8a5a44" },
    { id: "JE", name: "Java Estate",             short: "Java",        color: "#5e7d4f" },
    { id: "CR", name: "Costa Rican SHB Tarrazu", short: "Costa Rican", color: "#b5523b" },
    { id: "SM", name: "Sumatran Mandheling",     short: "Sumatran",    color: "#4b5d7a" }
  ],
  sampleVoters: 25,
  fixedBallots: []
};
/* ======================= end of CONFIG ======================= */

const OPTS = CONFIG.options;
const BY_ID = Object.fromEntries(OPTS.map(o => [o.id, o]));
const N = CONFIG.noun, NP = CONFIG.nounPlural;
const $ = id => document.getElementById(id);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const ordinal = n => n + (["th","st","nd","rd"][(n % 100 - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th");

/* ---------- Static text ---------- */
document.title = "Cathy Rudolph — " + CONFIG.title;
$("title").textContent = CONFIG.title;
$("subtitle").textContent = CONFIG.subtitle;
$("ballot-hint").textContent = `Tap the ${NP} in order of preference: your favorite first. Rank as many as you like; tap again to undo.`;
$("steps").innerHTML = `
  <li><strong>Rank your choices</strong><span>Put the ${NP} in order: 1st, 2nd, 3rd, and so on.</span></li>
  <li><strong>Count first choices</strong><span>If one ${N} gets more than half the votes, it wins.</span></li>
  <li><strong>Eliminate and transfer</strong><span>If not, last place is out and its ballots move to each voter's next choice. Repeat until one has a majority.</span></li>`;

/* ---------- The count ---------- */
function expandBallots(includeVisitor) {
  const out = [];
  electorate.forEach(b => { for (let i = 0; i < b.count; i++) out.push({ ranking: b.ranking }); });
  if (includeVisitor) out.push({ ranking: [...myRanking], visitor: true });
  return out;
}

function tally(ballots) {
  const active = new Set(OPTS.map(o => o.id));
  const top = b => b.ranking.find(id => active.has(id)) || null;
  const rounds = [];
  let firstCounts = null;

  while (true) {
    const counts = {};
    active.forEach(id => counts[id] = 0);
    let exhausted = 0;
    const assign = ballots.map(b => { const t = top(b); t ? counts[t]++ : exhausted++; return t; });
    const continuing = ballots.length - exhausted;
    const threshold = Math.floor(continuing / 2) + 1;
    if (!firstCounts) firstCounts = { ...counts };

    const ids = [...active];
    const max = Math.max(...ids.map(i => counts[i]));
    const leaders = ids.filter(i => counts[i] === max);
    const round = { n: rounds.length + 1, counts, assign, exhausted, continuing, threshold, active: new Set(active) };
    rounds.push(round);

    if (ids.length === 1) { round.winner = ids[0]; break; }
    if (leaders.length === 1 && max >= threshold) { round.winner = leaders[0]; break; }

    // Eliminate last place, with a tiebreak if needed
    const min = Math.min(...ids.map(i => counts[i]));
    let tied = ids.filter(i => counts[i] === min);
    if (tied.length > 1) {
      const names = tied.map(i => BY_ID[i].short).join(" and ");
      const fmin = Math.min(...tied.map(i => firstCounts[i]));
      const t2 = tied.filter(i => firstCounts[i] === fmin);
      if (t2.length === 1) {
        round.tieNote = `${names} tied for last with ${min} each. The tie goes to first-round votes, and ${BY_ID[t2[0]].short} had fewer.`;
        tied = t2;
      } else {
        const pick = t2[Math.floor(Math.random() * t2.length)];
        round.tieNote = `${names} tied for last, and also tied in first-round votes, so one was drawn by lot (a common real-world tiebreaker).`;
        tied = [pick];
      }
    }
    const elim = tied[0];
    round.eliminated = elim;
    active.delete(elim);

    round.transfers = {};
    round.toExhausted = 0;
    ballots.forEach((b, i) => {
      if (assign[i] !== elim) return;
      const next = top(b);
      next ? round.transfers[next] = (round.transfers[next] || 0) + 1 : round.toExhausted++;
    });
  }
  return rounds;
}

/* ---------- Sample voters ----------
   Voters fall into 2–3 "taste camps", each with its own ranking, and
   individuals drift a little from their camp. Some voters rank at random
   and a few rank only part of the list. Each electorate is re-dealt until
   the count is a good teaching example: at least three rounds, no ties,
   and (usually) a first-round leader who doesn't win. */
const rand = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function makeVoter(camp) {
  const r = [...camp];
  for (let k = rand(3); k > 0; k--) { const i = rand(r.length - 1); [r[i], r[i + 1]] = [r[i + 1], r[i]]; }
  if (Math.random() < 0.12) r.length = Math.max(2, r.length - 2);
  return r;
}

function groupBallots(rankings) {
  const m = new Map();
  rankings.forEach(r => { const k = r.join(","); m.set(k, (m.get(k) || 0) + 1); });
  return [...m].map(([k, count]) => ({ count, ranking: k.split(",") })).sort((a, b) => b.count - a.count);
}

function dealElectorate() {
  if (CONFIG.fixedBallots && CONFIG.fixedBallots.length) return CONFIG.fixedBallots;
  const ids = OPTS.map(o => o.id), n = CONFIG.sampleVoters;
  const wantUpset = Math.random() < 0.65;
  let voters;
  for (let attempt = 0; attempt < 4000; attempt++) {
    const camps = Array.from({ length: 2 + rand(2) }, () => shuffle([...ids]));
    const weights = camps.map(() => 0.5 + Math.random());
    const sum = weights.reduce((a, b) => a + b);
    voters = Array.from({ length: n }, () => {
      if (Math.random() < 0.15) return shuffle([...ids]);
      let x = Math.random() * sum, c = 0;
      while (x > weights[c]) x -= weights[c++];
      return makeVoter(camps[c]);
    });
    const rs = tally(voters.map(ranking => ({ ranking })));
    const r1 = rs[0].counts, max = Math.max(...Object.values(r1));
    if (Object.values(r1).some(c => c < 2)) continue;   // every option needs real first-choice support
    if (rs.length < 3 || rs.some(r => r.tieNote)) continue;
    const leads = Object.keys(r1).filter(i => r1[i] === max);
    const upset = leads.length === 1 && leads[0] !== rs.at(-1).winner;
    if (attempt < 3000 && upset !== wantUpset) continue;
    return groupBallots(voters);
  }
  return groupBallots(voters);
}

let electorate = dealElectorate();

/* ---------- Ballot picker ---------- */
let myRanking = [];

function renderPicks() {
  $("picks").innerHTML = OPTS.map(o => {
    const r = myRanking.indexOf(o.id);
    return `<button class="pick ${r >= 0 ? "ranked" : ""}" style="--c:${o.color}" data-id="${o.id}"
              aria-pressed="${r >= 0}" aria-label="${o.name}${r >= 0 ? ", ranked " + ordinal(r + 1) : ""}">
              <span class="rank">${r >= 0 ? r + 1 : ""}</span>
              <span class="name">${o.name}</span>
              <span class="sw"></span>
            </button>`;
  }).join("");
  const pv = $("vote-preview");
  pv.hidden = myRanking.length === 0;
  if (myRanking.length) {
    const first = BY_ID[myRanking[0]].short;
    const backups = myRanking.slice(1).map(id => BY_ID[id].short);
    pv.innerHTML = `Your vote starts with <strong>${first}</strong>.` +
      (backups.length ? ` Backups, in order: ${backups.join(", ")}.` : ` With no backups, your ballot sits out if ${first} is eliminated.`);
  }
  $("cast").disabled = myRanking.length === 0;
  $("clear").disabled = myRanking.length === 0;
}

$("picks").addEventListener("click", e => {
  const btn = e.target.closest(".pick");
  if (!btn) return;
  const id = btn.dataset.id;
  const i = myRanking.indexOf(id);
  i >= 0 ? myRanking.splice(i, 1) : myRanking.push(id);
  renderPicks();
});
$("clear").addEventListener("click", () => { myRanking = []; renderPicks(); });
$("cast").addEventListener("click", () => startCount(true));
$("skip").addEventListener("click", () => startCount(false));
$("redeal").addEventListener("click", () => {
  electorate = dealElectorate();
  $("results").hidden = true;
  $("box-note").innerHTML = `<strong>New voters dealt.</strong> ` + boxNoteText();
});
const boxNoteText = () => (CONFIG.fixedBallots && CONFIG.fixedBallots.length)
  ? `Your ballot joins ${electorate.reduce((a, b) => a + b.count, 0)} sample ballots already in the box.`
  : `Your ballot joins ${CONFIG.sampleVoters} sample voters already in the box. They're different every visit, so there's no sure way to back a winner.`;
$("box-note").textContent = boxNoteText();

/* ---------- Results ---------- */
let ballots = [], rounds = [], cur = 0, myIndex = -1, altWinner = null, lastWidths = {};

function startCount(withVisitor) {
  if (window.crTrack) window.crTrack('rcv_interaction', { cast_ballot: withVisitor });
  ballots = expandBallots(withVisitor);
  rounds = tally(ballots);
  myIndex = withVisitor ? ballots.length - 1 : -1;
  altWinner = withVisitor ? tally(expandBallots(false)).at(-1).winner : null;
  cur = 0;
  lastWidths = {};
  $("results").hidden = false;
  renderRound();
  $("results").scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderRound() {
  const r = rounds[cur], prev = rounds[cur - 1], total = ballots.length, isLast = cur === rounds.length - 1;
  const outIn = {};
  rounds.forEach(x => { if (x.eliminated) outIn[x.eliminated] = x.n; });
  const mine = myIndex >= 0 ? r.assign[myIndex] : undefined;

  const bars = OPTS.map(o => {
    const inRace = r.active.has(o.id);
    if (!inRace) {
      return `<div class="bar-row out" style="--c:${o.color}">
        <div class="bar-name">${o.short}<small>Out in round ${outIn[o.id]}</small></div>
        <div class="track"><div class="fill" data-id="${o.id}" style="width:${lastWidths[o.id] || 0}%" data-w="0"></div></div>
        <div class="bar-count">–</div></div>`;
    }
    const c = r.counts[o.id];
    const delta = prev && prev.transfers[o.id] ? `<span class="delta">+${prev.transfers[o.id]}</span>` : "";
    const cls = r.winner === o.id ? "winning" : r.eliminated === o.id ? "losing" : "";
    const tags = [
      r.winner === o.id ? `<span class="tag win">Winner</span>` : "",
      r.eliminated === o.id ? `<span class="tag cut">Eliminated</span>` : "",
      mine === o.id ? `<span class="tag you">Your vote</span>` : ""
    ].join(" ");
    return `<div class="bar-row ${cls}" style="--c:${o.color}">
      <div class="bar-name">${o.short}${tags ? "<br>" + tags : ""}</div>
      <div class="track">
        <div class="fill" data-id="${o.id}" style="width:${lastWidths[o.id] ?? 0}%" data-w="${(c / total) * 100}"></div>
        <div class="majority" style="left:${(r.threshold / total) * 100}%"></div>
      </div>
      <div class="bar-count">${c}${delta}</div></div>`;
  }).join("");

  // What happened this round
  let story;
  if (r.winner) {
    const w = BY_ID[r.winner], c = r.counts[r.winner];
    story = rounds.length === 1
      ? `<strong>${w.name}</strong> has ${c} of ${r.continuing} votes, more than half, so it wins in the first round. No eliminations needed.`
      : `<strong>${w.name}</strong> now has ${c} of ${r.continuing} votes, more than half. <strong>It wins.</strong>`;
  } else {
    const e = BY_ID[r.eliminated], c = r.counts[r.eliminated];
    const moves = Object.entries(r.transfers).sort((a, b) => b[1] - a[1]).map(([id, n]) => `${BY_ID[id].short} +${n}`);
    if (r.toExhausted) moves.push(`${r.toExhausted} with no choices left (exhausted)`);
    story = `No ${N} has more than half yet. <strong>${e.name}</strong> has the fewest votes (${c}) and is eliminated. `;
    if (r.tieNote) story += r.tieNote + " ";
    story += c === 0 ? `It had no votes, so no ballots move.`
      : `Its ${plural(c, "ballot moves", "ballots move")} to each voter's next choice still in the race: ${moves.join(", ")}.`;
  }

  // Where the visitor's ballot is
  let yours = "";
  if (myIndex >= 0) {
    const rank = mine ? myRanking.indexOf(mine) + 1 : 0;
    const fallback = rank > 1 ? ` That's your ${ordinal(rank)} choice, because your higher picks are out.` : "";
    if (!mine) {
      yours = `Every ${N} you ranked is out, so your ballot is <strong>exhausted</strong> and sits out the rest of the count. Ranking more choices keeps a ballot in play longer.`;
    } else if (r.winner === mine) {
      yours = `Your ballot is counting for <strong>${BY_ID[mine].short}</strong>, the winner.${fallback}`;
    } else if (r.eliminated === mine) {
      const next = rounds[cur + 1].assign[myIndex];
      yours = `Your ballot is counting for <strong>${BY_ID[mine].short}</strong>, which is eliminated this round. ` +
        (next ? `Next round it moves to your next choice still in the race, <strong>${BY_ID[next].short}</strong>. Your vote isn't wasted.`
              : `You didn't rank any other ${N} still in the race, so your ballot will be exhausted.`);
    } else {
      yours = `Your ballot is counting for <strong>${BY_ID[mine].short}</strong> this round.${fallback}`;
    }
  }

  // Takeaways on the final round
  let insights = "";
  if (isLast) {
    if (window.crTrack) window.crTrack('rcv_complete', { rounds: rounds.length });
    const items = [];
    const r1 = rounds[0].counts, max1 = Math.max(...Object.values(r1));
    const lead1 = Object.keys(r1).filter(id => r1[id] === max1);
    if (rounds.length > 1 && lead1.length === 1 && lead1[0] !== r.winner) {
      items.push(`<strong>${BY_ID[lead1[0]].short}</strong> led the first round with ${max1} votes but didn't win. Once later choices were counted, <strong>${BY_ID[r.winner].short}</strong> had broader support. Under a single-choice vote, ${BY_ID[lead1[0]].short} would have won with less than half.`);
    }
    if (myIndex >= 0 && altWinner) {
      items.push(altWinner === r.winner
        ? `Without your ballot, ${BY_ID[altWinner].short} would still have won.`
        : `<strong>Your ballot changed the outcome.</strong> Without it, ${BY_ID[altWinner].short} would have won.`);
    }
    if (items.length) insights = `<ul class="insights">${items.map(i => `<li>${i}</li>`).join("")}</ul>`;
  }

  const ballotList = renderBallotList();

  $("results").innerHTML = `
    <div class="round-head">
      <h2>Round ${r.n} <span style="color:var(--muted);font-weight:400">of ${rounds.length}</span></h2>
      <div class="dots">${rounds.map((_, i) => `<i class="${i <= cur ? "on" : ""}"></i>`).join("")}</div>
    </div>
    <p class="need">${r.n === 1 ? `Round 1 counts only each ballot's <strong>first</strong> choice. ` : `Each ballot counts for its highest-ranked ${N} still in the race. `}${plural(r.continuing, "ballot", "ballots")} in play, so a ${N} needs <strong>${r.threshold}</strong> to win (more than half).${r.exhausted ? ` ${r.exhausted} exhausted.` : ""}</p>
    ${yours ? `<p class="yours"><span class="yours-label">Where your vote is</span>${yours}</p>` : ""}
    <div class="bars">${bars}</div>
    <div class="legend"><b></b> Majority line</div>
    <p class="story">${story}</p>
    ${insights}
    <div class="nav">
      <button class="btn ghost" id="back" ${cur === 0 ? "disabled" : ""}>Back</button>
      ${isLast
        ? `<button class="btn primary" id="again">Try a different ballot</button>`
        : `<button class="btn primary" id="next">${cur === rounds.length - 2 ? "See the result" : "Next round"}</button>`}
    </div>
    ${ballotList}`;

  // Animate bars from their previous widths
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll(".fill").forEach(f => {
      f.style.width = f.dataset.w + "%";
      lastWidths[f.dataset.id] = +f.dataset.w;
    });
  }));

  $("back").onclick = () => { cur--; renderRound(); };
  if ($("next")) $("next").onclick = () => { cur++; renderRound(); };
  if ($("again")) $("again").onclick = () => {
    $("results").hidden = true;
    $("ballot").scrollIntoView({ behavior: "smooth", block: "start" });
  };
}

function renderBallotList() {
  const chain = ranking => `<span class="chain">${ranking.map((id, i) =>
    `<span class="chip" style="--c:${BY_ID[id].color}">${i + 1}. ${BY_ID[id].short}</span>`).join("")}</span>`;
  const rows = electorate.map(b =>
    `<div class="ballot-row"><span class="n">${b.count}×</span>${chain(b.ranking)}</div>`);
  if (myIndex >= 0) rows.push(`<div class="ballot-row me"><span class="n">You</span>${chain(myRanking)}</div>`);
  return `<details><summary>See all ${ballots.length} ballots</summary>${rows.join("")}</details>`;
}

renderPicks();

/* ---- Ref forwarding: carry ?ref= onto portfolio links ---- */
(function () {
  var ref = window.CR_REF;
  if (!ref || ref === '(none)') return;
  document.querySelectorAll('a[href*="askadmin-web.github.io/ubiquitous-memory"]').forEach(function (a) {
    var u = new URL(a.getAttribute('href'), window.location.href);
    u.searchParams.set('ref', ref);
    a.setAttribute('href', u.toString());
  });
})();
</script>
</body>
</html>
